<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的隨身紀錄器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }
        h2 { text-align: center; color: #333; }
        label { display: block; margin-top: 15px; color: #666; }
        
        select, input, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box; /* 確保 padding 不會撐破寬度 */
        }
        
        button {
            background-color: #007bff;
            color: white;
            border: none;
            margin-top: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #ccc; }
        
        #status {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: green;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 快速紀錄</h2>
    
    <form id="recordForm">
        <label for="category">紀錄類別</label>
        <select id="category" name="category">
            <option value="花費">💰 花費</option>
            <option value="待辦">✅ 待辦事項</option>
            <option value="靈感">💡 靈感</option>
            <option value="日記">📔 日記</option>
        </select>

        <label for="content">內容</label>
        <input type="text" id="content" name="content" placeholder="輸入內容..." required>

        <button type="submit" id="submitBtn">送出紀錄</button>
    </form>
    
    <div id="status"></div>
</div>

<script>
    // ★請將下方的網址換成你剛剛在 Apps Script 部署拿到的網址★
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz8itTSwks-d-aMBryu3TQa56md4mQ6RcFIJZ5JvuZ72kMU6FgBpVz6B8NXez2YIGEy/exec'; 

    const form = document.forms['recordForm'];
    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', e => {
        e.preventDefault();
        
        submitBtn.disabled = true;
        submitBtn.innerText = "傳送中...";
        statusDiv.innerText = "";

        // 使用 fetch 發送資料
        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                statusDiv.innerText = "🎉 紀錄成功！已存入試算表";
                form.reset(); // 清空表單
                submitBtn.disabled = false;
                submitBtn.innerText = "送出紀錄";
                
                // 3秒後清除成功訊息
                setTimeout(() => { statusDiv.innerText = ""; }, 3000);
            })
            .catch(error => {
                console.error('Error!', error.message);
                statusDiv.innerText = "❌ 發生錯誤，請檢查網路或網址";
                statusDiv.style.color = "red";
                submitBtn.disabled = false;
                submitBtn.innerText = "送出紀錄";
            });
    });
</script>

</body>
</html>
